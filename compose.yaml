services:
  desktop:
    build:
      context: .
      dockerfile: Dockerfile.desktop
    container_name: linux-desktop
    environment:
      VNC_PW: ${VNC_PASSWORD:-linuxdesktop}
    volumes:
      - ./config:/home/kasm-user
    ports:
      - "6901:6901"
    shm_size: "512m"
    restart: unless-stopped
